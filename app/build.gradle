plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp" version "2.0.21-1.0.28"
}

// Release signing credentials live in keystore.properties (NOT committed).
// Copy keystore.properties.example to keystore.properties and fill in your own values.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists()
    && keystoreProps["storeFile"] != null
    && keystoreProps["storePassword"] != null
    && keystoreProps["keyAlias"] != null
    && keystoreProps["keyPassword"] != null

android {
    namespace "com.xadblock.module"
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.xadblock.module"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "0.1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // If keystore.properties is missing, fall back to the debug signature.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // LSPosed supplies the LibXposed API at runtime; never package it in this APK.
    compileOnly "io.github.libxposed:api:102.0.0"
    implementation("io.github.libxposed:service:101.0.0") {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
    }

    implementation platform("androidx.compose:compose-bom:2025.04.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    ksp "androidx.room:room-compiler:2.7.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"
}
